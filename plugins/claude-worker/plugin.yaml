name: claude-worker
version: "0.1.0"
description: "Delegate coding tasks to an isolated Claude Code CLI subprocess (installed-CLI OAuth only, --strict-mcp-config with an empty generated MCP config, scoped tool allowlist, cwd pinned to the canonical Git worktree root resolved dynamically from the request — that single repository is the only directory bind-mounted into the sandbox). Auto-routes claude-sonnet-5 (default) / claude-opus-5 (architecture, security, hard-debugging, or one controlled post-failure escalation), backed by a per-failure-class circuit breaker with cooldown. In EVERY Discord-origin session — any guild channel, any DM, and every thread under either — direct patch/write_file/skill_manage edits inside a Git worktree are blocked for the whole session and every code change goes through the tool; a successful run does not hand back direct edit access, and the only release is an explicit Terra fallback that actually returned a result. Terminal commands that invoke the Claude CLI directly on the host are refused outright. Other platforms are never in scope; paths outside every Git worktree are never gated. Emits redacted JSONL telemetry and an advisory Terra auxiliary-task review for substantial changes. Opt-in via plugins.enabled — fully dark on disk until explicitly enabled."
author: "Hermes"
hooks:
  - pre_gateway_dispatch
  - pre_tool_call
  - post_tool_call
